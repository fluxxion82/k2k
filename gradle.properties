kotlin.code.style=official

# The Kotlin compile daemon is a separate process, so org.gradle.jvmargs does not size it. Setting
# only the Gradle heap leaves the compiler on its default, which is the usual cause of a KMP build
# that is slow or OOMs for no visible reason.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g

org.gradle.parallel=true
org.gradle.caching=true

# kotlin.incremental=false used to be set here and was described as necessary for KMP/native. It was
# not: Kotlin/Native incremental compilation is governed by kotlin.incremental.native and is off by
# default anyway, so this flag only ever disabled incremental compilation for JVM. Removed.

# Verified working on a full build: entry stores, then "Reusing configuration cache" on the next run.
org.gradle.configuration-cache=true
